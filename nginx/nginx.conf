include /etc/nginx/conf.d/service-url.inc;

server {
    server_name festi.koreacentral.cloudapp.azure.com;
    
    server_tokens off;

    # 로드 밸런서(LB) IP 대역 신뢰 설정
    # LB를 거쳐오면 실제 사용자 IP는 X-Forwarded-For에 담깁니다.
    set_real_ip_from 172.16.0.0/16; # VNet 내부 대역
    set_real_ip_from 168.63.129.16; # Azure Health Probe IP (필요시 추가)
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;

    # Health Check 로그 끄기 (선택사항)
    location = /healthz {
        access_log off;
        return 200 'OK';
    }

    location / {
        proxy_pass http://nextjs_upstream;
        
        # 기본 헤더
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # VNet/LB 환경 필수 헤더
        # 사용자의 원본 IP와 프로토콜 정보를 Next.js에 전달
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/festi.koreacentral.cloudapp.azure.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/festi.koreacentral.cloudapp.azure.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = festi.koreacentral.cloudapp.azure.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name festi.koreacentral.cloudapp.azure.com;
    return 404; # managed by Certbot


}