services:
  app-blue:
    image: ghcr.io/5unk3n/app:latest
    container_name: app-blue
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app-green:
    image: ghcr.io/5unk3n/app:latest
    container_name: app-green
    restart: always
    ports:
      - '3001:3000'
    env_file:
      - .env
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
